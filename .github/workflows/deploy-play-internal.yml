# Builds a signed release bundle of Leak Out and uploads it to the Play Console's private
# testing track on every push to main. Setup of every secret, key and variable: docs/deployment.md
# Versioning (GitVersion gives versionName x.y.z, versionCode derives from it): docs/deployment.md#versioning
# Release notes (from the commits since the previous release tag): docs/deployment.md#release-notes

name: Deploy to Play internal testing

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, in order: a newer run waits instead of cancelling the running one.
concurrency:
  group: deploy-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    # The secrets live in this environment, which only accepts deployments from main.
    environment: play-store
    timeout-minutes: 45
    permissions:
      # Pushes the v<x.y.z> tag of each release, which the next run's GitVersion builds on.
      contents: write
    defaults:
      run:
        working-directory: src
    env:
      PACKAGE_NAME: nl.hexmaster.leakout
      BUNDLE_PATH: src/app/build/outputs/bundle/release/app-release.aab

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitVersion needs the full history and every tag.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check required secrets
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_KEYSTORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS \
                      PLAY_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::Secret $name is not set in the play-store environment. See docs/deployment.md."
            done
            exit 1
          fi
          echo "All required secrets are set."

      - name: Run unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Compute version
        working-directory: .
        env:
          MAJOR_MINOR_PATCH: ${{ steps.gitversion.outputs.majorMinorPatch }}
          FULL_SEMVER: ${{ steps.gitversion.outputs.fullSemVer }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Prints VERSION_NAME=x.y.z and VERSION_CODE=n, or fails with the reason.
          bash scripts/compute-release-version.sh "$MAJOR_MINOR_PATCH" "$COMMIT_SHA" > "$RUNNER_TEMP/version.env"
          cat "$RUNNER_TEMP/version.env" >> "$GITHUB_ENV"
          source "$RUNNER_TEMP/version.env"
          {
            echo "### Leak Out release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION_NAME\` (GitVersion \`$FULL_SEMVER\`) |"
            echo "| Version code | \`$VERSION_CODE\` |"
            echo "| Track | \`$PLAY_TRACK\` |"
            echo "| Release status | \`$PLAY_RELEASE_STATUS\` |"
            echo "| Commit | \`$COMMIT_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Version $VERSION_NAME, version code $VERSION_CODE"

      # The "What's new" text of the Play release, from the commits since the previous release tag.
      # Release notes never block a deployment: if the generator or its tests fail, the fallback is used.
      - name: Generate release notes
        working-directory: .
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          fallback='Bug fixes and improvements.'
          if ! bash scripts/generate-release-notes.test.sh > "$RUNNER_TEMP/release-notes-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/release-notes-tests.log"
            echo "::warning::The release-notes tests failed, so this release gets the fallback notes. See docs/deployment.md#release-notes."
            notes="$fallback"
          elif ! notes=$(bash scripts/generate-release-notes.sh "$COMMIT_SHA"); then
            echo "::warning::Generating the release notes failed, so this release gets the fallback notes. See docs/deployment.md#release-notes."
            notes="$fallback"
          fi
          mkdir -p "$RUNNER_TEMP/whatsnew"
          # No trailing newline: Play counts it towards the 500-character limit.
          printf '%s' "$notes" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          {
            echo ""
            echo "#### Release notes (en-US)"
            echo ""
            echo '```text'
            echo "$notes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$notes"

      - name: Decode upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        env:
          LEAKOUT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          LEAKOUT_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          LEAKOUT_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          LEAKOUT_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Verify bundle signature
        working-directory: .
        run: |
          output=$(jarsigner -verify "$BUNDLE_PATH" 2>&1) || true
          echo "$output"
          if ! grep -q "jar verified." <<< "$output"; then
            echo "::error::$BUNDLE_PATH is not signed. Nothing was uploaded."
            exit 1
          fi

      - name: Keep the bundle as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leak-out-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: ${{ env.BUNDLE_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.BUNDLE_PATH }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          # whatsnew-<locale> files, written by "Generate release notes".
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # Only after a successful upload: the tag is what makes the next commit on main the next patch.
      - name: Tag the release
        working-directory: .
        run: |
          tag="v$VERSION_NAME"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists on this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Leak Out $VERSION_NAME (version code $VERSION_CODE)"
            echo ""
            cat "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          } > "$RUNNER_TEMP/tag-message.txt"
          git tag -a "$tag" --cleanup=whitespace -F "$RUNNER_TEMP/tag-message.txt" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Remove upload keystore
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks"
