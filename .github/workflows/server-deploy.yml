# Builds, tests, versions, publishes and deploys the game server (server/) from main to Azure
# (see server/README.md, "Deployment", and docs/repository-layout.md).
# The image name comes from the API project (ContainerRegistry, ContainerRepository); the tag is
# <semver>-<short commit sha>: the semantic version GitVersion calculates from server-v<x.y.z> tags
# (server/GitVersion.yml) plus the commit. GitVersion can give two merges the same version; the
# commit keeps every tag unique, so a deployment always changes the container app's image and rolls
# out a new revision instead of leaving the old image running under a reused tag.
name: server-deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-*.yml'
      - '.github/scripts/server-*'
  workflow_dispatch:

permissions:
  contents: read

# Deployments never overlap and are never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: server

jobs:
  build-test:
    name: server
    uses: ./.github/workflows/server-build-test.yml

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    # Only the version crosses jobs: the registry name equals the ACR admin user name (a secret),
    # so GitHub drops any job output that contains it. The deploy job reads it again.
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      tag: ${{ steps.container.outputs.tag }}
    steps:
      # GitVersion needs the full history to calculate the version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.3.x'

      # Only server-v<x.y.z> tags count, never the app's v<x.y.z> release tags.
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: server/GitVersion.yml

      - name: Read container settings from the API project
        id: container
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          properties=$(dotnet msbuild src/HexMaster.LeakOut.Api \
            -getProperty:ContainerRegistry -getProperty:ContainerRepository)
          registry=$(jq -r '.Properties.ContainerRegistry' <<< "$properties")
          repository=$(jq -r '.Properties.ContainerRepository' <<< "$properties")
          tag="$VERSION-${GITHUB_SHA::7}"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$repository:$tag" >> "$GITHUB_OUTPUT"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$registry/$repository:$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.container.outputs.registry }}
          username: ${{ secrets.ACR_LOGIN_USERNAME }}
          password: ${{ secrets.ACR_LOGIN_PASSWORD }}

      - name: Publish container image
        # The informational version is what the API returns in its X-API-Version header.
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
          TAG: ${{ steps.container.outputs.tag }}
        run: |
          dotnet publish src/HexMaster.LeakOut.Api -c Release -t:PublishContainer \
            -p:ContainerImageTags="$TAG" \
            -p:Version="$VERSION" \
            -p:InformationalVersion="$VERSION+${GITHUB_SHA::7}"

      # The API must never run as root (ContainerUser in the API project).
      - name: Verify the image runs as non-root
        env:
          IMAGE: ${{ steps.container.outputs.image }}
        run: |
          docker pull --quiet "$IMAGE"
          user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')
          if [[ -z "$user" || "$user" == "root" || "$user" == 0 || "$user" == 0:* ]]; then
            echo "::error::Image $IMAGE runs as root (user '${user}'); set ContainerUser in the API project"
            exit 1
          fi
          echo "Image $IMAGE runs as user '$user'"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Must match location in server/infrastructure/main.bicepparam: ARM rejects a deployment name
      # reused in another location.
      DEPLOYMENT_LOCATION: northeurope
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - name: Read container settings from the API project
        id: container
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          properties=$(dotnet msbuild src/HexMaster.LeakOut.Api \
            -getProperty:ContainerRegistry -getProperty:ContainerRepository)
          registry=$(jq -r '.Properties.ContainerRegistry' <<< "$properties")
          repository=$(jq -r '.Properties.ContainerRepository' <<< "$properties")
          if [[ -z "$registry" || -z "$repository" || -z "$TAG" ]]; then
            echo "::error::Container registry, repository or image tag is empty"
            exit 1
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$repository:$TAG" >> "$GITHUB_OUTPUT"

      # The API refuses to start without the Google settings, and an empty registry or database
      # credential would only fail inside Azure. Fail here, before anything changes.
      - name: Check required secrets
        env:
          ACR_LOGIN_USERNAME: ${{ secrets.ACR_LOGIN_USERNAME }}
          ACR_LOGIN_PASSWORD: ${{ secrets.ACR_LOGIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SIGNING_KEY: ${{ secrets.GOOGLE_SIGNING_KEY }}
        run: |
          missing=0
          for name in ACR_LOGIN_USERNAME ACR_LOGIN_PASSWORD POSTGRES_ADMIN_PASSWORD \
                      GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_SIGNING_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION_ID }}

      # main.bicepparam reads every value below with readEnvironmentVariable(), so no value
      # appears on the command line.
      - name: Deploy infrastructure and API
        id: deployment
        env:
          API_IMAGE: ${{ steps.container.outputs.image }}
          SERVICE_VERSION: ${{ needs.publish.outputs.version }}
          ACR_LOGIN_SERVER: ${{ steps.container.outputs.registry }}
          ACR_LOGIN_USERNAME: ${{ secrets.ACR_LOGIN_USERNAME }}
          ACR_LOGIN_PASSWORD: ${{ secrets.ACR_LOGIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SIGNING_KEY: ${{ secrets.GOOGLE_SIGNING_KEY }}
        run: |
          fqdn=$(az deployment sub create \
            --name "leakout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            --only-show-errors \
            --query properties.outputs.apiFullyQualifiedDomainName.value --output tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$API_IMAGE\` to https://$fqdn" >> "$GITHUB_STEP_SUMMARY"

      # The container app scales to zero, so the first request may wait for a cold start. Healthy is
      # not enough: the X-API-Version header must name this build, or the old image is still serving.
      - name: Smoke test
        env:
          FQDN: ${{ steps.deployment.outputs.fqdn }}
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          expected="$EXPECTED_VERSION+${GITHUB_SHA::7}"
          for attempt in $(seq 1 30); do
            if headers=$(curl --fail --silent --show-error --max-time 10 --dump-header - --output /dev/null "https://$FQDN/alive"); then
              actual=$(grep -i '^x-api-version:' <<< "$headers" | cut -d' ' -f2- | tr -d '\r')
              if [[ "$actual" == "$expected" ]]; then
                echo "https://$FQDN/alive is healthy and runs $actual"
                exit 0
              fi
              echo "Attempt $attempt: healthy, but runs '$actual' instead of '$expected'"
            else
              echo "Attempt $attempt: not healthy yet"
            fi
            sleep 10
          done
          echo "::error::https://$FQDN/alive did not become healthy on version $expected"
          exit 1
