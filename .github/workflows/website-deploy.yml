# Builds the public website (website/) with Hugo and deploys its infrastructure and content to the
# Azure Static Web App on every push to main that changes the website (see website/README.md).
# After a healthy deployment the release job tags the commit website-v<x.y.z> (GitVersion,
# website/GitVersion.yml) and creates its GitHub release.
name: website-deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deployments never overlap and are never cancelled half-way.
concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  # Keep in step with website-pull-request.yml and website/README.md.
  HUGO_VERSION: 0.165.0

jobs:
  test:
    name: website / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the leaderboard script
        working-directory: website
        run: npm test

  deploy:
    name: website / deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Must match location in website/infrastructure/main.bicepparam: ARM rejects a deployment name
      # reused in another location.
      DEPLOYMENT_LOCATION: westeurope
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      # The same federated credential as the server deployment (environment "production").
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        run: |
          outputs=$(az deployment sub create \
            --name "leakout-website-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file website/infrastructure/main.bicep \
            --parameters website/infrastructure/main.bicepparam \
            --only-show-errors \
            --query properties.outputs --output json)
          echo "resource-group=$(jq -r '.resourceGroupName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.staticWebAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "hostname=$(jq -r '.defaultHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "public-hostname=$(jq -r '.publicHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      # Built after the infrastructure so canonical, hreflang, Open Graph and sitemap URLs are absolute:
      # WEBSITE_BASE_URL when set, otherwise the public host name: the custom domain from
      # main.bicepparam (leakout.hexmaster.nl), or the Static Web App's own address without one.
      # LEAKOUT_SCORE_SERVER_URL optionally overrides the score server in hugo.toml (also in the CSP).
      - name: Build the site
        env:
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
          PUBLIC_HOSTNAME: ${{ steps.infrastructure.outputs.public-hostname }}
          HUGO_PARAMS_SCORESERVERURL: ${{ vars.LEAKOUT_SCORE_SERVER_URL }}
        run: |
          [[ -z "$HUGO_PARAMS_SCORESERVERURL" ]] && unset HUGO_PARAMS_SCORESERVERURL
          base_url="${WEBSITE_BASE_URL:-https://$PUBLIC_HOSTNAME/}"
          echo "Building for $base_url"
          hugo --source website/src --panicOnWarning --minify --baseURL "$base_url" \
            --destination "$GITHUB_WORKSPACE/public"

      # The deployment token is read at run time and masked; it is never stored as a secret.
      - name: Read the deployment token
        id: token
        env:
          RESOURCE_GROUP: ${{ steps.infrastructure.outputs.resource-group }}
          NAME: ${{ steps.infrastructure.outputs.name }}
        run: |
          token=$(az staticwebapp secrets list --name "$NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey --output tsv)
          if [[ -z "$token" ]]; then
            echo "::error::No deployment token for Static Web App $NAME"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload the site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: public
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        env:
          HOSTNAME: ${{ steps.infrastructure.outputs.hostname }}
        run: |
          for path in / /nl/ /fr/ /de/ /es/ /rules/ /faq/ /leaderboard/ /sitemap.xml /robots.txt /app-ads.txt; do
            curl --fail --silent --show-error --max-time 20 --output /dev/null "https://$HOSTNAME$path"
            echo "https://$HOSTNAME$path is up"
          done
          curl --silent --show-error --head "https://$HOSTNAME/" | grep -i '^content-security-policy:' \
            || { echo "::error::The Content-Security-Policy header is missing"; exit 1; }
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$HOSTNAME" >> "$GITHUB_STEP_SUMMARY"

  # Only after a healthy deployment: the website-v<x.y.z> tag is what moves the next merge to the next
  # version. Its own tag prefix keeps it apart from app and server releases running at the same time.
  release:
    name: website / release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # GitVersion and the release notes need the full history and every tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.8.x'

      # Only website-v<x.y.z> tags count (website/GitVersion.yml).
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: website/GitVersion.yml

      # MajorMinorPatch, not SemVer: on main GitHub Flow adds a commit count label to SemVer.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          bash scripts/publish-release.sh --prefix website-v --version "$VERSION" --commit "$GITHUB_SHA" \
            --title "Website $VERSION" --path website
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "\`website-v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
