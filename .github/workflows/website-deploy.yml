# Builds the public website (website/) with Hugo and deploys its infrastructure and content to the
# Azure Static Web App on every push to main that changes the website (see website/README.md).
name: website-deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deployments never overlap and are never cancelled half-way.
concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  # Keep in step with website-pull-request.yml and website/README.md.
  HUGO_VERSION: 0.165.0

jobs:
  build:
    name: website / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: Test the leaderboard script
        working-directory: website
        run: npm test

      # Optional repository variables override hugo.toml: WEBSITE_BASE_URL (the site's public address,
      # for absolute hreflang links) and LEAKOUT_SCORE_SERVER_URL (the score server the leaderboard reads).
      - name: Build the site
        env:
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
          HUGO_PARAMS_SCORESERVERURL: ${{ vars.LEAKOUT_SCORE_SERVER_URL }}
        run: |
          [[ -z "$HUGO_PARAMS_SCORESERVERURL" ]] && unset HUGO_PARAMS_SCORESERVERURL
          hugo --source website/src --panicOnWarning --minify --destination "$GITHUB_WORKSPACE/public" \
            ${WEBSITE_BASE_URL:+--baseURL "$WEBSITE_BASE_URL"}

      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: public
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: website / deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Must match location in website/infrastructure/main.bicepparam: ARM rejects a deployment name
      # reused in another location.
      DEPLOYMENT_LOCATION: westeurope
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: website
          path: public

      # The same federated credential as the server deployment (environment "production").
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        run: |
          outputs=$(az deployment sub create \
            --name "leakout-website-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file website/infrastructure/main.bicep \
            --parameters website/infrastructure/main.bicepparam \
            --only-show-errors \
            --query properties.outputs --output json)
          echo "resource-group=$(jq -r '.resourceGroupName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.staticWebAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "hostname=$(jq -r '.defaultHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      # The deployment token is read at run time and masked; it is never stored as a secret.
      - name: Read the deployment token
        id: token
        env:
          RESOURCE_GROUP: ${{ steps.infrastructure.outputs.resource-group }}
          NAME: ${{ steps.infrastructure.outputs.name }}
        run: |
          token=$(az staticwebapp secrets list --name "$NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey --output tsv)
          if [[ -z "$token" ]]; then
            echo "::error::No deployment token for Static Web App $NAME"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload the site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: public
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        env:
          HOSTNAME: ${{ steps.infrastructure.outputs.hostname }}
        run: |
          for path in / /nl/ /fr/ /de/ /es/ /rules/ /faq/ /leaderboard/; do
            curl --fail --silent --show-error --max-time 20 --output /dev/null "https://$HOSTNAME$path"
            echo "https://$HOSTNAME$path is up"
          done
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
