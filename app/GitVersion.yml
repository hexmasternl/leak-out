# Semantic versioning for the Leak Out app, read by the deploy workflow (.github/workflows/deploy-play-internal.yml).
# Every deployment from main is tagged v<major>.<minor>.<patch>; the next commit on main bumps the patch.
# Bump minor or major with "+semver: minor" / "+semver: major" in a commit message (or PR title),
# or by raising next-version below. Strategy: docs/deployment.md#versioning
workflow: GitHubFlow/v1
# Tags v<x.y.z> count; the server's server-v<x.y.z> tags never move the app's version, because the
# prefix must start the tag (docs/repository-layout.md). Keep the v optional: GitVersion parses
# next-version with the same prefix, and a required v would make it fail on "0.1.0".
tag-prefix: '[vV]?'
next-version: 0.1.0
