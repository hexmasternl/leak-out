<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achievement Icons</title>
<style>
:root{--bg:#07111C;--card:#122538;--text:#F2F7FB;--muted:#A9BACB}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
h1{font-size:22px;margin:0 0 4px}p{color:var(--muted);margin:0 0 24px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
figure{margin:0;background:var(--card);border-radius:16px;padding:12px;text-align:center}
img{width:100%;height:auto;border-radius:12px;display:block}
figcaption{font-size:13px;margin-top:8px}small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
</style></head><body>
<h1>Leak Out: proposed achievement icons</h1>
<p>512×512, generated from the SVG sources by <code>generate-icons.mjs</code>. Ring colour: liquid = progress/lifetime, brass = skill, violet = hidden, steel/aqua/gold = tier I/II/III.</p>
