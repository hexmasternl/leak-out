<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Leak Out – Daily Pipe promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=block" rel="stylesheet">
<style>
  @font-face { font-family: "Wendy One"; src: url("../../../app/src/app/src/main/res/font/wendy_one_regular.ttf"); font-display: block; }
  @font-face { font-family: "Fredoka"; src: url("../../../app/src/app/src/main/res/font/fredoka.ttf"); font-display: block; }
  html, body { margin: 0; background: #07111C; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script src="levels.js"></script>
<script>
  const scene = new URLSearchParams(location.search).get('scene') || 'v1';
  const s = document.createElement('script'); s.src = scene + '.js';
  s.onload = async () => {
    await Promise.all([
      document.fonts.load('40px "Wendy One"'), document.fonts.load('40px "Varela Round"'), document.fonts.load('40px "Fredoka"'),
    ]).catch(() => {});
    await document.fonts.ready;
    const ctx = document.getElementById('c').getContext('2d');
    window.renderFrame = (t) => { ctx.save(); window.SCENE.draw(ctx, t); ctx.restore(); };
    window.frameData = (t, type = 'image/png') => { window.renderFrame(t); return document.getElementById('c').toDataURL(type, 0.95); };
    window.ready = { fonts: [...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family) };
    // live preview when opened by hand
    if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { window.renderFrame(((performance.now() - t0) / 1000) % LO.DURATION); requestAnimationFrame(loop); }; loop(); }
  };
  document.body.appendChild(s);
</script>
</body>
</html>
