schema: spec-driven

context: |
  Leak Out: a 2D pipe-building puzzle game for Android (Kotlin, Jetpack Compose).
  The app is written in the `app/src/` directory of the repository. `app/src/` is the Gradle
  root (settings, wrapper, gradle/libs.versions.toml) and holds the `core` (pure Kotlin) and
  `app` (Android) modules. Paths like `core/...` or `app/...` in app specs and tasks are
  relative to `app/src/`, and Gradle commands run from `app/src/`.
  The online game server (.NET, Azure) lives in `server/`: its solution in `server/src/`, its
  Bicep templates in `server/infrastructure/`; its specs are prefixed `server-`.
  See docs/repository-layout.md for the layout and docs/project-plan.md for the design and architecture.

